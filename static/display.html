<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <title>科研诚信签名墙</title>
  <link rel="stylesheet" href="/assets/styles.css?v=__ASSET_VERSION__">
</head>
<body class="display-page">
  <main class="wall-shell">
    <div class="wall-stage" id="wall-stage">
      <div class="signature-layer" id="signature-layer"></div>
      <div class="wall-empty" id="wall-empty">
        <strong>扫码留下您的签名</strong>
      </div>
      <div class="wall-status" id="wall-status">现场开放</div>
      <span class="wall-connection" id="connection-status">连接中</span>
    </div>
    <aside class="wall-aside">
      <div class="qr-card">
        <img id="qr-image" alt="扫码进入签名页">
        <div class="qr-kicker">Join the wall</div>
        <h2 class="qr-title">扫码留下签名</h2>
        <p class="qr-copy" id="qr-copy">用手机写下您的名字，让每一份承诺在现场被看见。</p>
      </div>
    </aside>
  </main>
  <script src="/assets/signature.js?v=__ASSET_VERSION__" defer></script>
  <script src="/assets/wallLayout.js?v=__ASSET_VERSION__" defer></script>
  <script src="/assets/wallSync.js?v=__ASSET_VERSION__" defer></script>
  <script src="/assets/display.js?v=__ASSET_VERSION__" defer></script>
</body>
</html>

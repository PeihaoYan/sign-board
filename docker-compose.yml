services:
  sign-board:
    build: .
    container_name: sign-board
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18180:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

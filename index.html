<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>科研诚信责任书签署 · 电子签到墙</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg0:#030a18;
    --bg1:#061634;
    --bg2:#0b2352;
    --cyan:#4fd6ff;
    --blue:#2f7fd6;
    --red:#d2233c;
    --ink:#eaf2ff;
    --ink2:rgba(214,230,255,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--bg0);}
  body{
    font-family:"HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC",
                "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--ink);
  }

  /* ================= 1920×1080 画布：按视口等比缩放，任何大屏都不变形 ================= */
  #stage{
    position:absolute;left:50%;top:50%;
    width:1920px;height:1080px;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--s,1));
    overflow:hidden;
    background:
      radial-gradient(1200px 680px at 50% -14%, #123a7a 0%, rgba(18,58,122,0) 62%),
      radial-gradient(900px 900px at 8% 108%, rgba(35,110,190,.30) 0%, rgba(3,10,24,0) 60%),
      radial-gradient(760px 760px at 96% 104%, rgba(210,35,60,.16) 0%, rgba(3,10,24,0) 62%),
      linear-gradient(178deg, var(--bg1) 0%, var(--bg2) 34%, var(--bg1) 72%, var(--bg0) 100%);
  }

  /* 网格 + 星点：低透明度铺底，不干扰正文 */
  #grid,#dots,#glow,#lattice{position:absolute;inset:0;pointer-events:none;}
  #grid{
    background:
      repeating-linear-gradient(90deg, rgba(120,180,255,.055) 0 1px, transparent 1px 120px),
      repeating-linear-gradient(0deg,  rgba(120,180,255,.045) 0 1px, transparent 1px 120px);
    -webkit-mask-image:radial-gradient(120% 88% at 50% 40%, #000 12%, transparent 78%);
            mask-image:radial-gradient(120% 88% at 50% 40%, #000 12%, transparent 78%);
  }
  #dots{
    background:
      radial-gradient(1.7px 1.7px at 8% 22%, rgba(150,215,255,.55) 0 100%, transparent 100%),
      radial-gradient(1.4px 1.4px at 17% 78%, rgba(150,215,255,.38) 0 100%, transparent 100%),
      radial-gradient(1.9px 1.9px at 26% 12%, rgba(200,230,255,.42) 0 100%, transparent 100%),
      radial-gradient(1.3px 1.3px at 34% 66%, rgba(150,215,255,.30) 0 100%, transparent 100%),
      radial-gradient(1.6px 1.6px at 43% 30%, rgba(200,230,255,.26) 0 100%, transparent 100%),
      radial-gradient(1.4px 1.4px at 57% 84%, rgba(150,215,255,.30) 0 100%, transparent 100%),
      radial-gradient(1.9px 1.9px at 66% 18%, rgba(200,230,255,.40) 0 100%, transparent 100%),
      radial-gradient(1.3px 1.3px at 74% 62%, rgba(150,215,255,.28) 0 100%, transparent 100%),
      radial-gradient(1.7px 1.7px at 83% 34%, rgba(150,215,255,.48) 0 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 76%, rgba(200,230,255,.36) 0 100%, transparent 100%),
      radial-gradient(1.4px 1.4px at 12% 46%, rgba(140,205,255,.24) 0 100%, transparent 100%),
      radial-gradient(1.6px 1.6px at 88% 52%, rgba(140,205,255,.24) 0 100%, transparent 100%);
  }
  #glow::before,#glow::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);}
  #glow::before{width:760px;height:520px;left:-190px;top:-150px;
    background:radial-gradient(closest-side, rgba(79,214,255,.20), transparent 72%);}
  #glow::after{width:820px;height:560px;right:-230px;bottom:-190px;
    background:radial-gradient(closest-side, rgba(210,35,60,.20), transparent 72%);}
  #lattice{opacity:.5;}
  #lattice svg{position:absolute;bottom:-40px;}
  #lattice .l{left:-60px;}
  #lattice .r{right:-60px;transform:scaleX(-1);}

  /* ================= 顶部校名标识 ================= */
  #brand{
    position:absolute;left:96px;top:66px;
    display:flex;align-items:center;gap:22px;
  }
  #brand .mark{
    position:relative;width:70px;height:70px;flex:none;
    display:grid;place-items:center;
    border:2px solid rgba(79,214,255,.55);border-radius:50%;
    box-shadow:0 0 28px rgba(79,214,255,.28), inset 0 0 20px rgba(79,214,255,.16);
  }
  #brand .mark::before{
    content:"";width:30px;height:30px;border-radius:50%;
    border:2px solid rgba(210,35,60,.85);
    box-shadow:0 0 16px rgba(210,35,60,.5);
  }
  #brand .mark::after{
    content:"";position:absolute;width:52px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(79,214,255,.85),transparent);
    transform:rotate(-32deg);
  }
  #brand .cn{font-size:27px;font-weight:700;letter-spacing:.10em;}
  #brand .en{
    margin-top:6px;font-size:13px;letter-spacing:.20em;
    color:var(--ink2);text-transform:uppercase;
  }

  /* ================= 中央收名卡 ================= */
  #card{
    position:absolute;left:270px;top:214px;width:1380px;height:660px;
    border-radius:30px;
    background:linear-gradient(180deg, rgba(12,38,80,.60) 0%, rgba(6,20,46,.34) 100%);
    border:1px solid rgba(96,168,246,.28);
    box-shadow:
      0 40px 130px rgba(0,0,0,.52),
      inset 0 1px 0 rgba(174,216,255,.16);
    backdrop-filter:blur(2px);
    padding:52px 62px 44px;
    display:flex;flex-direction:column;
  }
  #card::before{  /* 顶部红色主色条 */
    content:"";position:absolute;left:50%;top:-2px;transform:translateX(-50%);
    width:300px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,transparent,var(--red),transparent);
    box-shadow:0 0 22px rgba(210,35,60,.75);
  }
  #card .corner{position:absolute;width:46px;height:46px;border:2px solid rgba(79,214,255,.62);}
  #card .corner.tl{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:30px 0 0 0;}
  #card .corner.tr{right:-1px;top:-1px;border-left:0;border-bottom:0;border-radius:0 30px 0 0;}
  #card .corner.bl{left:-1px;bottom:-1px;border-right:0;border-top:0;border-radius:0 0 0 30px;}
  #card .corner.br{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 30px 0;}

  #head{display:flex;align-items:center;justify-content:space-between;}
  #head h2{
    font-size:38px;font-weight:700;letter-spacing:.12em;
    display:flex;align-items:center;gap:20px;
  }
  #head h2::before{
    content:"";width:7px;height:38px;border-radius:4px;
    background:linear-gradient(180deg,var(--cyan),var(--blue));
    box-shadow:0 0 18px rgba(79,214,255,.6);
  }
  #head .count{font-size:22px;color:var(--ink2);letter-spacing:.06em;}
  #head .count b{
    font-size:40px;color:var(--cyan);font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:0;
    text-shadow:0 0 22px rgba(79,214,255,.5);
  }
  #rule{
    height:1px;margin:26px 0 34px;flex:none;
    background:linear-gradient(90deg,transparent,rgba(96,168,246,.42),transparent);
  }

  /* 姓名区（live 区域） */
  #grid-list{
    flex:1;overflow:hidden;
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    grid-auto-rows:min-content;
    column-gap:14px;row-gap:12px;
    align-content:start;
  }
  .name{
    height:46px;display:flex;align-items:center;gap:10px;
    padding:0 14px;border-radius:10px;
    background:rgba(126,190,255,.07);
    border:1px solid rgba(126,190,255,.16);
    border-left:3px solid rgba(79,214,255,.55);
    font-size:20px;letter-spacing:.04em;white-space:nowrap;
    animation:pop .5s cubic-bezier(.22,1,.36,1) both;
  }
  .name i{
    width:6px;height:6px;border-radius:50%;flex:none;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){.name{animation:none;}}

  #empty{
    grid-column:1/-1;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    color:var(--ink2);
  }
  #empty .ring{
    width:104px;height:104px;border-radius:50%;
    border:2px dashed rgba(96,168,246,.45);
    display:grid;place-items:center;
    animation:spin 18s linear infinite;
  }
  #empty .ring::after{
    content:"";width:14px;height:14px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 22px var(--cyan);
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #empty p{font-size:30px;letter-spacing:.22em;}

  /* ================= 标题 ================= */
  #title{position:absolute;left:0;right:0;top:756px;text-align:center;}
  #title .sub{
    font-size:22px;letter-spacing:.42em;color:rgba(150,205,255,.82);
    text-transform:uppercase;
  }
  #title h1{
    margin-top:20px;
    font-size:104px;font-weight:800;letter-spacing:.14em;
    text-indent:.14em;
    background:linear-gradient(180deg,#ffffff 22%,#b9dcff 78%,#7fb8ee 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 34px rgba(79,150,255,.42));
  }
  #title .tag{
    margin-top:22px;font-size:26px;letter-spacing:.30em;text-indent:.30em;
    color:rgba(214,230,255,.74);
  }

  /* ================= 底部信息栏 ================= */
  #foot{
    position:absolute;left:0;right:0;bottom:52px;
    display:flex;align-items:center;justify-content:center;gap:34px;
    font-size:19px;letter-spacing:.16em;color:rgba(196,218,255,.60);
  }
  #foot .sep{width:1px;height:18px;background:rgba(150,200,255,.28);}
  #foot .dot{
    width:9px;height:9px;border-radius:50%;background:#3ddc97;
    box-shadow:0 0 12px #3ddc97;animation:beat 2.2s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* 左右竖排小字，填充两侧空白 */
  .vtext{
    position:absolute;top:50%;transform:translateY(-50%);
    font-size:17px;letter-spacing:.62em;color:rgba(150,200,255,.34);
    writing-mode:vertical-rl;user-select:none;
  }
  .vtext.l{left:96px;}
  .vtext.r{right:96px;}
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="dots"></div>
  <div id="glow"></div>
  <div id="lattice">
    <svg class="l" width="760" height="330" viewBox="0 0 760 330" fill="none">
      <g stroke="#5fc8ff" stroke-opacity="0.30" stroke-width="1.2">
        <path d="M-20 300 L190 300 L300 190 L190 80 L-20 80 Z"/>
        <path d="M190 300 L400 300 L510 190 L400 80 L190 80"/>
        <path d="M190 80 L300 190 M190 300 L300 190 M300 190 L510 190 M400 80 L400 300"/>
        <circle cx="300" cy="190" r="3.4" fill="#5fc8ff" stroke="none"/>
        <circle cx="190" cy="80" r="2.6" fill="#5fc8ff" stroke="none"/>
        <circle cx="190" cy="300" r="2.6" fill="#5fc8ff" stroke="none"/>
        <circle cx="400" cy="80" r="2.6" fill="#5fc8ff" stroke="none"/>
        <circle cx="400" cy="300" r="2.6" fill="#5fc8ff" stroke="none"/>
      </g>
    </svg>
    <svg class="r" width="760" height="330" viewBox="0 0 760 330" fill="none">
      <g stroke="#e2536a" stroke-opacity="0.22" stroke-width="1.2">
        <path d="M-20 300 L190 300 L300 190 L190 80 L-20 80 Z"/>
        <path d="M190 300 L400 300 L510 190 L400 80 L190 80"/>
        <path d="M190 80 L300 190 M190 300 L300 190 M300 190 L510 190 M400 80 L400 300"/>
        <circle cx="300" cy="190" r="3.4" fill="#e2536a" stroke="none"/>
        <circle cx="190" cy="80" r="2.6" fill="#e2536a" stroke="none"/>
        <circle cx="190" cy="300" r="2.6" fill="#e2536a" stroke="none"/>
        <circle cx="400" cy="80" r="2.6" fill="#e2536a" stroke="none"/>
        <circle cx="400" cy="300" r="2.6" fill="#e2536a" stroke="none"/>
      </g>
    </svg>
  </div>

  <div id="brand">
    <div class="mark"></div>
    <div>
      <div class="cn" contenteditable="true">中国科学技术大学</div>
      <div class="en" contenteditable="true">University of Science and Technology of China</div>
    </div>
  </div>

  <div id="card">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div id="head">
      <h2>电子签到墙</h2>
      <div class="count">已签到 <b id="count">0</b> 人</div>
    </div>
    <div id="rule"></div>
    <div id="grid-list"></div>
  </div>

  <div id="title">
    <div class="sub" contenteditable="true">RESEARCH INTEGRITY PLEDGE</div>
    <h1 contenteditable="true">科研诚信责任书签署</h1>
    <div class="tag" contenteditable="true">恪守学术规范 · 坚守科研诚信</div>
  </div>

  <div id="foot">
    <span class="dot"></span>
    <span contenteditable="true">扫码签到 · 实时上墙</span>
  </div>

  <div class="vtext l">诚信为本 · 求真务实</div>
  <div class="vtext r">电子签到墙</div>
</div>

<script>
/* ==========================================================================
   1) 名单来源
   - 直接改下面 NAMES 数组即可（留空则从页面 .name 元素里读取）；
   - 接后端时把 NAMES 换成接口数据，然后调用 render() 重绘。
   ========================================================================== */
const NAMES = [];                 // 填入真实名单，例：["张三","李四","王五"]；留空则读取页面姓名或演示数据
const MAX_SHOW = 72;              // 屏上最多显示多少个名字，超出只更新人数
const DEMO_FILL = true;           // 无真实名单时是否填充演示姓名（正式使用请改为 false）

const DEMO_SURNAME = "赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜";
const DEMO_GIVEN = ["子墨","思远","一鸣","若涵","嘉禾","明轩","雨辰","昊然","文博","启航","行知","知远","立诚","求真","思齐","允中"];

function makeDemo(n){
  const out = new Set();
  let i = 0;
  while (out.size < n && i < n * 20){
    const s = DEMO_SURNAME[Math.floor(Math.random() * DEMO_SURNAME.length)];
    const g = DEMO_GIVEN[Math.floor(Math.random() * DEMO_GIVEN.length)];
    out.add(s + g); i++;
  }
  return [...out];
}

const listEl = document.getElementById('grid-list');
const countEl = document.getElementById('count');

function collect(){
  let names = NAMES.filter(Boolean);
  if (!names.length){
    names = [...document.querySelectorAll('#grid-list .name')].map(e => e.textContent.trim());
  }
  if (!names.length && DEMO_FILL) names = makeDemo(MAX_SHOW);
  return names;
}

function render(){
  const all = collect();
  const shown = all.slice(0, MAX_SHOW);
  listEl.innerHTML = '';

  if (!shown.length){
    listEl.innerHTML = '<div id="empty"><div class="ring"></div><p>等待签到</p></div>';
  } else {
    shown.forEach((name, i) => {
      const d = document.createElement('div');
      d.className = 'name';
      d.innerHTML = '<i></i><span contenteditable="true"></span>';
      d.querySelector('span').textContent = name;
      d.style.animationDelay = Math.min(i * 22, 900) + 'ms';
      listEl.appendChild(d);
    });
  }
  countEl.textContent = all.length;
}

/* ==========================================================================
   2) 模拟现场陆续签到（正式接入真实数据后可删除这段）
   ========================================================================== */
const SIMULATE = true;
document.getElementById('grid-list').style.gridTemplateColumns = 'repeat(6, 1fr)';

render();

if (SIMULATE && DEMO_FILL){
  let n = Math.min(14, MAX_SHOW);
  listEl.innerHTML = '';
  const seed = makeDemo(n);
  const push = () => {
    if (n >= MAX_SHOW) return;
    n++;
    const cur = seed.slice(0, n - 1);
    const nw = makeDemo(n).find(x => !cur.includes(x)) || ('同学' + n);
    const d = document.createElement('div');
    d.className = 'name';
    d.innerHTML = '<i></i><span contenteditable="true"></span>';
    d.querySelector('span').textContent = nw;
    listEl.appendChild(d);
    countEl.textContent = n;
  };
  seed.forEach((name, i) => {
    const d = document.createElement('div');
    d.className = 'name';
    d.innerHTML = '<i></i><span contenteditable="true"></span>';
    d.querySelector('span').textContent = name;
    d.style.animationDelay = i * 40 + 'ms';
    listEl.appendChild(d);
  });
  countEl.textContent = n;
  setInterval(push, 2600);
}

/* ==========================================================================
   3) 按视口等比缩放，投影/大屏任意分辨率都不变形
   ========================================================================== */
function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('stage').style.setProperty('--s', s);
}
addEventListener('resize', fit); fit();

/* 按 F 或双击进入/退出全屏 */
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFS(); });
addEventListener('dblclick', toggleFS);
function toggleFS(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}
</script>
</body>
</html>

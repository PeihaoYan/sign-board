name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev.lock
            requirements-constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Compile Python files
        run: python -m compileall -q app tests tools
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check public candidate
        run: python tools/prepare_git.py
      - name: Check public content
        run: python tools/check_public_content.py
      - name: Check documentation links
        run: python tools/check_docs_links.py
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Build image
        run: docker build --tag sign-board:ci .
      - name: Start container
        run: |
          docker run --detach --name sign-board-ci \
            --env-file .env \
            --env ADMIN_TOKEN=ci-admin-token \
            --publish 18180:8000 \
            sign-board:ci
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18180/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs sign-board-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force sign-board-ci
